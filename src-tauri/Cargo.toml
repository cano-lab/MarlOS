[package]
name = "marlos"
version = "0.2.0"
description = "MarlOS - Semantic Document Environment"
authors = ["MarlOS Team"]
license = "Proprietary"
repository = ""
edition = "2021"
default-run = "marlos"

[lib]
name = "marlos_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "healing_test_runner"
path = "src/bin/healing_test_runner.rs"

[[bin]]
name = "marlos-cli"
path = "src/bin/marlos.rs"

[[bin]]
name = "marlos-mcp"
path = "src/bin/marlos-mcp.rs"

[[bin]]
name = "typesetter_smoke"
path = "src/bin/typesetter_smoke.rs"
required-features = ["tauri-app"]

[[bin]]
name = "citations_smoke"
path = "src/bin/citations_smoke.rs"
required-features = ["tauri-app"]

# Throwaway spike for the typst PDF backend swap (plan M0). Compiles
# a hardcoded typst doc with a minimal World impl and writes PDF.
# Deleted after M2 when markdown→typst is wired through.
[[bin]]
name = "typst_spike"
path = "src/bin/typst_spike.rs"

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"], optional = true }
tauri-plugin-shell = { version = "2", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-fs = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
futures = "0.3"
rusqlite = { version = "0.34", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
log = "0.4"
env_logger = "0.11"
dirs = "6"
pdfium-render = "0.8"
pdf-extract = "0.7"
image = "0.25"
tiff = "0.9"
exr = "1.7"
half = "2"  # For f16 half-precision floats in EXR
base64 = "0.22"
epub = "2"
html2text = "0.12"
reqwest = { version = "0.12", features = ["blocking", "json"] }
regex = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
urlencoding = "2"
scraper = "0.22"
toml = "0.8"
headless_chrome = "1.0"
anyhow = "1"

# Typst PDF backend — replacing pandoc + headless Chromium in M0..M6 of
# the plan at C:\Users\jerro\.claude\plans\rustling-riding-frost.md.
# Pinned to 0.14 (the current cycle) so a typst release doesn't silently
# move our paged-document semantics under us.
typst = "0.14"
typst-pdf = "0.14"
typst-syntax = "0.14"
typst-library = "0.14"
typst-utils = "0.14"
# Pure-Rust markdown parser with footnotes + GFM. Replaces the pandoc
# subprocess on the PDF export path (preview still uses pandoc).
comrak = "0.52"
# LaTeX-math → typst-math transpiler. Wraps `$...$` / `$$...$$` runs
# in manuscripts so authors keep writing TeX-style math.
mitex = "0.2"
# Decompresses the WOFF2 font assets bundled via @fontsource into OTF
# bytes that typst's FontBook can consume. @fontsource does not ship
# OTF/TTF in the npm package so this conversion is on the hot startup
# path; we cache the decoded faces in a OnceLock.
woff = "0.6"
open = "5"
rfd = "0.14"
walkdir = "2"

# For embeddings (optional, add later)
# ort = "2"  # ONNX Runtime

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-opener = "2"

[features]
default = ["custom-protocol", "tauri-app"]
custom-protocol = ["tauri/custom-protocol"]
tauri-app = ["dep:tauri", "dep:tauri-plugin-shell", "dep:tauri-plugin-dialog", "dep:tauri-plugin-fs", "dep:tauri-build"]
